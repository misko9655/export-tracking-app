@for(customer of customers(); track customer.id) {
<mat-card class="mat-bg-surface-container" [class.no-active-orders]="!customer.hasActiveOrders">
    <mat-card-title>
        {{customer.name}}
    </mat-card-title>
    <mat-card-subtitle>
        {{customer.country}}
    </mat-card-subtitle>
    @if(!customer.hasActiveOrders) {
    <mat-card-content>
        <p class="no-orders-label">Nema aktivnih trebovanja</p>
    </mat-card-content>
    }
    <mat-card-actions>
        <button matMiniFab (click)="goToCustomerOrders(customer.id)">
            <mat-icon>arrow_forward</mat-icon>
        </button>
        @if(role() === 'EXPORT' || role() === 'ADMIN') {
        <button matMiniFab (click)="onEditCustomer(customer)">
            <mat-icon>edit</mat-icon>
        </button>
        <button (click)="onDeleteCustomer(customer)" matMiniFab>
            <mat-icon>delete_outline</mat-icon>
        </button>
    }
    </mat-card-actions>
</mat-card>
}
