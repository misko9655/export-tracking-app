<div class="add-porudzbenica-stavka-dialog">
    <h2 matDialogTitle>{{data.title}}</h2>
    <mat-dialog-content [formGroup]="form">
        <mat-form-field appearance="outline">
            <mat-label>Artikal</mat-label>
            <input
                matInput
                [value]="artikalSearch()"
                (input)="onArtikalInput($any($event.target).value)"
                [matAutocomplete]="auto"
                placeholder="Pretraži po šifri ili nazivu"
            />
            <mat-autocomplete #auto="matAutocomplete" [displayWith]="displayRepromaterijal" (optionSelected)="onArtikalSelected($event)">
                @for (r of filteredRepromaterijali(); track r.sifraRepromaterijala) {
                    <mat-option [value]="r">{{ r.sifraRepromaterijala }} - {{ r.nazivRepromaterijala }}</mat-option>
                }
            </mat-autocomplete>
        </mat-form-field>
        <mat-form-field appearance="outline">
            <mat-label>Količina</mat-label>
            <input type="number" matInput formControlName="kolicina" />
        </mat-form-field>
        <mat-form-field appearance="outline">
            <mat-label>Cena po jedinici mere (RSD)</mat-label>
            <input type="number" matInput formControlName="cenaPoJm" min="0" step="0.01" />
        </mat-form-field>
    </mat-dialog-content>
    <mat-dialog-actions>
        <button matButton="filled" (click)="onSave()">Sačuvaj</button>
        <button matButton="filled" (click)="onClose()">Zatvori</button>
    </mat-dialog-actions>
</div>
